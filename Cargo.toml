[package]
name = "wow-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dropshot = { path = "../dropshot/dropshot" }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
http = "1"
serde_json = "1"
